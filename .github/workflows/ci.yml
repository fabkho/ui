name: CI

# Two cheap jobs per pull request, side by side: install from the lockfile, then Vitest (`Vitest`: the
# pure tests, no browser) and the stories (`Stories`: every story rendered in headless Chromium and
# checked by axe, WCAG 2.2 AA; it installs only the headless shell). Nothing runs on a push to `main`
# (the merged pull request already ran on the merge result) and no lint step exists yet: the repo has
# no linter configured. A new push to a pull request cancels the run still going. Storybook's own
# build, and its deploy to GitHub Pages, are storybook.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pnpm version is `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # cache: pnpm keeps the pnpm store between runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  stories:
    name: Stories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - run: pnpm test:storybook

      # The same stories, the dark theme: contrast is checked in both.
      - run: pnpm test:storybook:night
