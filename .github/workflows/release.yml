name: Release

# release-please (release-please-config.json, .release-please-manifest.json): on every push to
# `main` it keeps one pull request open, "chore(main): release x.y.z", with CHANGELOG.md and the
# package.json version written from the conventional commits merged since the last release. The
# owner merges it; the push that makes runs release-please again, which tags vX.Y.Z and creates the
# GitHub release. Apps then take the tag: `"@fabkho/ui": "github:fabkho/ui#vX.Y.Z"`. Nothing is
# published to npm.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# A pull request opened with the run's own token starts no CI workflow, so the release pull
# request has no checks: it only changes CHANGELOG.md, the manifest and the version.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: release pull request and tag
    if: github.repository == 'fabkho/ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One at a time and never cancelled: a run cut off between creating the release and tagging it.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write # the release commit's tag and the GitHub release
      pull-requests: write # the release pull request
      issues: write # its `autorelease: pending` / `tagged` labels
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
